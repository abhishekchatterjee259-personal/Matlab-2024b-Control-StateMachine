name: Matlab CI/CT

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Matlab Version 2024b
        uses: matlab-actions/setup-matlab@v2
        with:
          release: 2024b

      - name: CheckMatlab Installation
        uses: matlab-actions/run-command@v2
        with:
          command: |
            disp('MATLAB CI IS WORKING')
            version
            ver
      - name: Load Matlab Project
        uses: matlab-actions/run-command@v2
        with:
          command: |
            proj = matlab.project.loadProject(fullfile(pwd,'Controls.prj'));
            proj = currentProject
            disp(['LoadedProject-->',proj.Name]);